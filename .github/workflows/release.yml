name: Release

# main is the stable channel. Each push ships whatever changed since that
# target last shipped: migrations and web first, then mobile and desktop.
on:
  push:
    branches: [main]
  # Retry a failed run. Targets only ship what changed since their last
  # successful release, so rerunning is always safe.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Newest Xcode on GitHub's macOS 26 image. Expo's own SDK 58 image uses
  # Xcode 27; move to it once the runner image ships it.
  XCODE_VERSION: "26.6"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.affected.outputs.web }}
      mobile: ${{ steps.affected.outputs.mobile }}
      desktop: ${{ steps.desktop.outputs.changed }}
      desktop-fingerprint: ${{ steps.desktop.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # shipped/<target> marks the commit each target last released, so a
      # failed or skipped run never loses changes.
      - id: affected
        run: |
          affected() {
            local package=$1 tag=$2 code
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo true; return; }
            set +e
            bunx turbo query affected --packages "$package" --base "$tag" --head HEAD --exit-code >/dev/null
            code=$?
            set -e
            # 0 = unaffected, 1 = affected, 2 = error (ship to be safe).
            [[ $code -eq 0 ]] && echo false || echo true
          }
          echo "web=$(affected web shipped/web)" >> "$GITHUB_OUTPUT"
          echo "mobile=$(affected native shipped/mobile)" >> "$GITHUB_OUTPUT"
      # The desktop app loads https://kompose.dev, so only shell changes need
      # a new binary. Turbo's hash of the Electron build task covers its
      # sources, workspace deps, locked package versions, and packaging
      # config, and ignores root-config noise that marks every package affected.
      - id: desktop
        run: |
          fingerprint=$(bunx turbo run build --filter=@kompose/electron --dry=json \
            | jq -r '.tasks[] | select(.taskId == "@kompose/electron#build") | .hash')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/desktop-fp/$fingerprint" >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        run: |
          {
            echo "| Target | Ships |"
            echo "| --- | --- |"
            echo "| Web + migrations | ${{ steps.affected.outputs.web }} |"
            echo "| Mobile | ${{ steps.affected.outputs.mobile }} |"
            echo "| Desktop | ${{ steps.desktop.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web + migrations
    permissions:
      contents: write
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Vercel builds it, but --skip-domain keeps traffic on the current
      # deployment until migrations succeed.
      - name: Stage production deployment
        id: deploy
        run: |
          url=$(bunx vercel@65 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Migrate database
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bunx drizzle-kit migrate
      - name: Promote to production
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bunx vercel@65 promote "$URL" --yes --token "$VERCEL_TOKEN"
      - name: Mark web shipped
        run: |
          git tag -f shipped/web "$GITHUB_SHA"
          git push -f origin refs/tags/shipped/web

  # Clients must never be ahead of the API, so mobile and desktop wait for web.
  # They still run when web was skipped, but not when it failed.
  mobile:
    name: Mobile (fingerprint + OTA)
    permissions:
      contents: write
    needs: [changes, web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      build: ${{ steps.fingerprint.outputs.build }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Same value as the app's runtimeVersion (policy: fingerprint). An
      # ios-fp/<hash> tag means a binary with this native layer already
      # shipped, so a JS-only OTA update reaches it.
      - id: fingerprint
        working-directory: apps/native
        run: |
          fingerprint=$(bunx expo-updates runtimeversion:resolve --platform ios | jq -r .runtimeVersion)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/ios-fp/$fingerprint" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Fingerprint $fingerprint already shipped: publishing an OTA update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Fingerprint $fingerprint is new: building and submitting a binary." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish OTA update
        if: steps.fingerprint.outputs.build == 'false'
        working-directory: apps/native
        run: |
          eas update --channel production --environment production --platform ios \
            --message "$(git log -1 --format=%s)" --non-interactive
      - name: Mark mobile shipped
        if: steps.fingerprint.outputs.build == 'false'
        run: |
          git tag -f shipped/mobile "$GITHUB_SHA"
          git push -f origin refs/tags/shipped/mobile

  mobile-build:
    name: Mobile (iOS build + submit)
    permissions:
      contents: write
    needs: mobile
    if: needs.mobile.outputs.build == 'true'
    runs-on: macos-26
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # --local builds on this runner instead of EAS's paid build queue;
      # signing credentials and the build number still come from EAS.
      - name: Build
        working-directory: apps/native
        run: |
          eas build -p ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/kompose.ipa"
      - name: Submit to App Store Connect
        working-directory: apps/native
        run: |
          eas submit -p ios --profile production --path "$RUNNER_TEMP/kompose.ipa" \
            --non-interactive --wait
      - name: Mark fingerprint and mobile shipped
        env:
          FINGERPRINT: ${{ needs.mobile.outputs.fingerprint }}
        run: |
          git tag "ios-fp/$FINGERPRINT" "$GITHUB_SHA"
          git tag -f shipped/mobile "$GITHUB_SHA"
          git push origin "refs/tags/ios-fp/$FINGERPRINT"
          git push -f origin refs/tags/shipped/mobile

  desktop:
    name: Desktop
    permissions:
      contents: write
    needs: [changes, web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-26
    environment: production
    env:
      FINGERPRINT: ${{ needs.changes.outputs.desktop-fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Versions come from releases, so they never need a version-bump commit.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          echo "version=$(bunx semver --increment patch "$latest")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bun run build:desktop
      # electron-builder uploads every artifact electron-updater needs to a
      # draft release, which users can't see until the next steps publish it.
      - name: Package, sign, notarize, and upload a draft release
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # electron-builder's notarize step takes the key as a file path.
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          bunx electron-builder --mac --arm64 --publish always -c.extraMetadata.version="$VERSION"
      # Gatekeeper must accept the app before anyone can download it.
      - name: Verify
        working-directory: apps/electron/release/mac-arm64
        run: |
          codesign --verify --deep --strict Kompose.app
          xcrun stapler validate Kompose.app
          spctl --assess --type execute Kompose.app
      # Publishing as Latest is what installed apps auto-update from.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "v$VERSION" --draft=false --latest \
            --target "$GITHUB_SHA" --title "Kompose $VERSION"
      - name: Mark desktop shipped
        run: |
          git tag "desktop-fp/$FINGERPRINT" "$GITHUB_SHA"
          git tag -f shipped/desktop "$GITHUB_SHA"
          git push origin "refs/tags/desktop-fp/$FINGERPRINT"
          git push -f origin refs/tags/shipped/desktop
