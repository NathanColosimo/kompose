name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Type-check and builds run without production secrets.
  SKIP_ENV_VALIDATION: "1"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --affected compares against the PR base or the previous push.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx turbo run type-check --affected
      # Web is built by Vercel with production env. The native export
      # includes the Hermes bytecode compile, which catches syntax the
      # engine rejects before it reaches a release build.
      - name: Build iOS bundle and desktop shell
        run: bunx turbo run build --affected --filter=native --filter=@kompose/electron
        env:
          EXPO_PUBLIC_SERVER_URL: https://kompose.dev

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    env:
      # drizzle-kit check and generate never connect to the database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:check
