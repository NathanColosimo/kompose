name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Type-check and builds run without production secrets.
  SKIP_ENV_VALIDATION: "1"

jobs:
  # Pushes to main always run the full suite. A PR skips the build and
  # migration jobs when every changed file is docs or agent skills. Skipped
  # jobs count as passing for the required checks in the main ruleset.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          app=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            if ! printf '%s\n' "$files" | grep -qvE '^(\.agents/|\.claude/|documents/|skills-lock\.json$|([^/]+/)*[^/]+\.md$)'; then
              app=false
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  check:
    name: Type-check and build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # Remote cache only; fork PRs get no secrets and run without it.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected compares against the PR base or the previous push.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx turbo run type-check --affected
      # Web is built by Vercel with production env. The native export
      # includes the Hermes bytecode compile, which catches syntax the
      # engine rejects before it reaches a release build.
      - name: Build iOS bundle and desktop shell
        run: bunx turbo run build --affected --filter=native --filter=@kompose/electron
        env:
          EXPO_PUBLIC_SERVER_URL: https://kompose.dev
      # Native dependency versions must match the installed Expo SDK. Offline
      # mode checks against that SDK rather than the newest patch release, so
      # an Expo release alone can't fail CI.
      - name: Expo doctor
        working-directory: apps/native
        env:
          EXPO_OFFLINE: "1"
        run: bunx expo-doctor

  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      # drizzle-kit check never connects to the database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:check
