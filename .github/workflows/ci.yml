name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Type-check and builds run without production secrets.
  SKIP_ENV_VALIDATION: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    # Remote cache only; fork PRs get no secrets and run without it.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # --affected compares against the PR base or the previous push. Turbo
      # would look for a local `main`, but the checkout only has origin/main,
      # so it fell back to running every package.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the base above can be compared against.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx turbo run type-check --affected
      # Web is built by Vercel with production env. The native export
      # includes the Hermes bytecode compile, which catches syntax the
      # engine rejects before it reaches a release build. Doctor checks native
      # dependency versions against the installed Expo SDK.
      - name: Build iOS bundle, desktop shell, and Expo doctor
        run: bunx turbo run build doctor --affected --filter=native --filter=@kompose/electron
        env:
          EXPO_PUBLIC_SERVER_URL: https://kompose.dev

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    env:
      # drizzle-kit check never connects to the database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:check
